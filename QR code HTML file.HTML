<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artgatha Links</title>
    <style>
        /* --- CSS RESET & BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa; /* Light gray background for premium feel */
            color: #000000; /* Black text based on logo text */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- BRAND COLORS --- */
        :root {
            --brand-gold: #FFCB05; /* Approximated from the yellow logo icon */
            --brand-black: #000000;
        }

        /* --- MAIN CONTAINER --- */
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px; /* Ensures it looks good on desktop too */
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        /* --- HEADER SECTION --- */
        .header {
            margin-bottom: 40px;
        }

        .logo-img {
            max-width: 180px; /* Adjust size of the logo */
            height: auto;
            display: block;
            margin: 0 auto 15px auto;
        }

        .tagline {
            font-size: 1rem;
            color: #555; /* Slightly softer gray for tagline */
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* --- BUTTON LINKS SECTION --- */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Space between buttons */
        }

        .link-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: var(--brand-gold);
            color: var(--brand-black);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 50px; /* Fully rounded buttons */
            transition: all 0.3s ease;
            border: 2px solid transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* --- HOVER ANIMATION --- */
        .link-btn:hover {
            transform: translateY(-3px); /* Subtle lift effect */
            box-shadow: 0 7px 15px rgba(255, 203, 5, 0.4); /* Gold glow shadow */
            background-color: #ffe066; /* Slightly lighter gold on hover */
        }

        /* Optional: Add icons before text if desired later */
        /* .link-btn i {
            margin-right: 10px;
        } 
        */

        /* --- FOOTER --- */
        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <main class="container">
        <header class="header">
            <img src="image_27.png" alt="Artgatha Logo" class="logo-img"> 
            <p class="tagline">Bringing Art To Life</p>
        </header>

        <section class="links-container">
            <a href="https://www.artgatha.com/" target="_blank" class="link-btn">
                Website
            </a>
            
            <a href="https://www.instagram.com/artgatha.official?igsh=MTRzNDhvMWh5Njg5Zg==" target="_blank" class="link-btn">
                Instagram
            </a>
            
            <a href="https://www.facebook.com/share/1aDMmfQmLV/" target="_blank" class="link-btn">
                Facebook
            </a>
            
            <a href="https://youtube.com/@artgatha?si=D4xbh57kYgKO4Du1" target="_blank" class="link-btn">
                YouTube
            </a>
        </section>

        <footer>
            © <script>document.write(new Date().getFullYear())</script> Artgatha. All rights reserved.
        </footer>
        
    </main>

</body>
</html>
